x-environment:
  - &env-postgres-db POSTGRES_DB=${POSTGRES_DB}
  - &env-postgres-user POSTGRES_USER=${POSTGRES_USER}
  - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  - &env-geoserver-user GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
  - &env-geoserver-password GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
  - &env-postgres-port POSTGRES_PORT=${POSTGRES_PORT}
#Docker Compose odczytuje ${"{"}POSTGRES_DB{"}"} i zastępuje ten zapis odpowiednią wartością,
#& tworzy w YAML kotwicę (anchor), czyli nadaje nazwę fragmentowi konfiguracji.
#* pozwala później użyć tego fragmentu ponownie.
#pola zaczynające się od x- służą do przechowywania dodatkowej, wielokrotnego użytku konfiguracji


services: #definicje usług które mają tworzyć projekt
  postgis: #nazwa 1 usługi
    build: #obraz tej usługi ma zostać zbudowany na podstawie Dockerfile
      context: .. #jakie pliki projektu Docker otrzymuje do dyspozycji podczas budowania obrazu, .. to folder nadrzędny
      dockerfile: docker/postgis/Dockerfile #którego Dockerfile użyć do zbudowania
    image: 'postgis_prge' #nazwa obrazu który powstanie
    container_name: 'postgis_prge' #nazwa kontenera który ma powstać z tego obrazu
    environment: #zmienne  środowiskowe
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - 5444:5432 #host:kontener
    volumes: #podłączenie zasobu do kontenera
      - postgis-data:/var/lib/postgresql/data

  geoserver: #nazwa 2 usługi
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'geoserver_prge'
    container_name: 'geoserver_prge'
    environment:
      - SKIP_DEMO_DATA=true
      - *env-geoserver-user
      - *env-geoserver-password
    ports:
      - 9004:8080
    volumes:
      - ../config/geoserver_data:/opt/geoserver_data


  fastapi: #nazwa 3 usługi
    build:
      context: ..
      dockerfile: docker/fastapi/Dockerfile
    image: 'fastapi_prge'
    container_name: 'fastapi_prge'
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
      - *env-postgres-port
    ports:
      - 10004:10000


volumes: #deklaracja zasobu
  postgis-data:



